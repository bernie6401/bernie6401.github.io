<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 - 找不到頁面 | SBK Blog</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7785;
      --accent: #4f6df5;
      --border: #e3e7ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --card: #1c2027;
        --text: #e6e9ee;
        --muted: #8b95a3;
        --accent: #7b93ff;
        --border: #2a303a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .box {
      width: 100%;
      max-width: 480px;
      padding: 48px 32px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .code {
      margin: 0;
      font-size: 88px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 4px;
      color: var(--accent);
    }
    h1 { margin: 16px 0 8px; font-size: 22px; }
    p { margin: 0 0 28px; color: var(--muted); line-height: 1.7; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      color: var(--accent);
      text-decoration: none;
      font-size: 15px;
      transition: background .15s, color .15s;
    }
    a.primary { background: var(--accent); color: #fff; }
    a:hover { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>找不到這個頁面</h1>
    <p>網址可能打錯了，或是這篇文章已經被移動、刪除。</p>
    <div class="actions">
      <a class="primary" href="/">回到首頁</a>
      <a href="/archives/">文章列表</a>
      <a href="/tags/">標籤</a>
    </div>
  </div>
</body>
</html>
