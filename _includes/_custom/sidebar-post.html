<button id="custom-sidebar-toggle" class="custom-sidebar-toggle-btn" type="button" aria-label="Toggle sidebar" title="隱藏/顯示側邊欄">
  <span class="custom-sidebar-toggle-icon">&#9776;</span>
</button>

<aside id="custom-sidebar" class="custom-sidebar">
  <div class="custom-sidebar-inner">
    <div class="custom-sidebar-logo">Post Tree</div>
      <div id="custom-sidebar-tree"></div>
  </div>
</aside>

<script type="text/javascript">
  (function () {
    var STORAGE_KEY = 'customSidebarCollapsed';
    var body = document.body;
    var toggleBtn = document.getElementById('custom-sidebar-toggle');

    function applyState(collapsed) {
      body.classList.toggle('custom-sidebar-collapsed', collapsed);
    }

    var treeEl = document.getElementById('custom-sidebar-tree');
    if (treeEl && window.fetch) {
      fetch('{{ "/assets/sidebar-tree.html" | relative_url }}')
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (html) { treeEl.innerHTML = html; })
        .catch(function () {});
    }

    applyState(localStorage.getItem(STORAGE_KEY) === 'true');

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function () {
        var collapsed = !body.classList.contains('custom-sidebar-collapsed');
        applyState(collapsed);
        localStorage.setItem(STORAGE_KEY, collapsed);
      });
    }
  })();
</script>
